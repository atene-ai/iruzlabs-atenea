<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width">
<title>Atenea</title>
<link rel="stylesheet" href="start.css">
<script type="module" src="start.js"></script>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<span class="elapsed" aria-hidden="true"></span>
<main class="stage">
<div class="water" aria-hidden="true"></div>
<div class="lane"><div class="whale-x"><div class="whale-gaze"><div class="whale"><div class="whale-move"><div class="whale-loop">
<!-- whale --><svg class="whale-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><linearGradient id="st-atenea-grad" x1="15%" y1="0%" x2="85%" y2="100%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="28%" stop-color="#00C8FF"/><stop offset="68%" stop-color="#0891B2"/><stop offset="100%" stop-color="#0A4A6A"/></linearGradient><mask id="st-eyes" maskUnits="userSpaceOnUse" x="-100" y="-100" width="300" height="300"><rect x="-100" y="-100" width="300" height="300" fill="#fff"/><g id="gaze" class="bt-gaze"><g id="eye-pair" class="bt-eyes" fill="#000"><g transform="translate(0 0)"><rect class="bt-eye" x="0" y="0" width="0" height="0"/></g><g transform="translate(0 0)"><rect class="bt-eye" x="0" y="0" width="0" height="0"/></g><g transform="translate(0 0)"><path class="bt-eye-happy" opacity="0" d="" fill="none"/></g><g transform="translate(0 0)"><path class="bt-eye-happy" opacity="0" d="" fill="none"/></g></g></g></mask><g id="tail"></g><g id="atenea-layers" transform="translate(10.748 85.991) scale(0.012521 -0.012521)" fill-rule="evenodd"><path d="M1651 5619 c-218 -43 -372 -165 -472 -374 -59 -123 -74 -190 -74 -335 l0 -125 108 -270 109 -270 -22 -58 c-30 -79 -104 -158 -187 -199 -100 -49 -183 -50 -391 -4 -90 20 -181 36 -202 36 -85 0 -159 -117 -120 -190 5 -10 38 -39 72 -65 252 -190 586 -211 898 -58 79 39 109 61 180 132 132 133 192 265 193 426 0 111 -15 167 -94 339 -82 178 -103 252 -104 356 0 139 52 218 157 239 43 9 63 8 108 -5 110 -32 240 -205 299 -396 72 -237 113 -673 96 -1030 l-7 -156 -37 -7 c-87 -16 -318 -102 -456 -169 -322 -157 -581 -362 -845 -666 -359 -412 -572 -778 -685 -1172 -54 -190 -69 -293 -69 -463 -1 -158 8 -218 51 -350 130 -405 471 -628 893 -585 262 27 467 130 689 345 190 184 296 329 425 585 137 268 204 454 301 835 90 351 119 531 128 800 l2 70 32 -33 c54 -56 84 -166 137 -507 19 -122 43 -243 53 -270 17 -47 21 -50 57 -53 22 -2 49 -1 61 2 26 7 343 335 644 666 248 274 699 724 813 813 117 91 282 197 306 197 38 0 72 -22 72 -46 0 -12 -20 -62 - 47 -84 240 -138 94 -54 206 -119 250 -145 54 -31 80 -51 79 -63 -3 -30 6 -19 36 46 27 56 30 71 30 167 0 138 -10 169 -68 221 -103 91 -248 121 -398 80z" fill="#fff" fill-opacity=".65"/><path d="M4731 3687 c16 -12 79 -45 79 -42 0 7 -63 45 -74 45 -5 0 -7 -1 -5 -3z" fill="#fff" fill-opacity=".65"/></g></defs><g class="bt-b"><g id="torso"><use href="#atenea-layers"/></g></g></svg><!-- /whale -->
</div></div></div></div></div></div>
<div class="whale-hit" aria-hidden="true"></div>
<div class="fx" aria-hidden="true"><span class="trace"></span><span class="trace"></span><span class="ripple"></span></div>
<ol class="track sr" data-t-label="status.track">
<li class="station" data-phase="data" data-state="pending"><span data-t="status.phase.data"></span> <span class="sr"></span></li>
<li class="station" data-phase="engine" data-state="pending"><span data-t="status.phase.engine"></span> <span class="sr"></span></li>
<li class="station" data-phase="team" data-state="pending"><span data-t="status.phase.team"></span> <span class="sr"></span></li>
</ol>
<p class="voice"><span></span></p>
<p class="caption"><span class="caption-text"></span><button class="btn" data-look="small" data-act="openLogs" data-t="btn.openLogs" hidden></button></p>
<section class="sheet">
<div class="sheet-edge"></div><div class="sheet-fill"></div>
<div class="sheet-body">
<section class="card" data-kind="recommend" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.{reason}"></h2><p class="lead"><span data-t="reason.place.{reason}"></span> <span class="ask" data-t="card.recommend.ask"></span></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="rec" data-rec data-t="btn.useRec"></button><button class="btn" data-look="soft" data-act="answer" data-detail="keep" data-keep data-t="btn.keepDrive"></button><button class="btn" data-look="link" data-act="pick" data-rec data-t="btn.otherPlace"></button><button class="btn" data-look="primary" data-act="pick" data-norec data-t="btn.pickPlace"></button><p class="foot" data-t="note.changeLater"></p></div></section>
<section class="card" data-kind="rejected" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.rejected"></h2><p class="lead" data-t="reason.place.{reason}"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="pick" data-t="btn.repick"></button><button class="btn" data-look="soft" data-act="answer" data-detail="rec" data-rec data-t="btn.useRec"></button><button class="btn" data-look="soft" data-act="answer" data-detail="keep" data-keep data-t="btn.keepDrive"></button><p class="foot" data-t="note.changeLater"></p></div></section>
<section class="card" data-kind="missing" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.missing"></h2><p class="lead" data-t="card.missing.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="retry" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="pick" data-t="btn.relocate"></button><button class="btn" data-look="soft" data-act="freshStart" data-t="btn.freshStart"></button></div><p class="miss" data-t="card.missing.retryMissed" hidden></p><p class="foot" data-t="note.changeLater"></p></section>
<section class="card" data-kind="picked" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.picked"></h2><p class="lead" data-t="card.picked.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="use" data-t="btn.continue"></button><button class="btn" data-look="soft" data-act="pick" data-t="btn.repick"></button><p class="foot" data-t="note.changeLater"></p></div></section>
<section class="card" data-kind="import" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.import"></h2><p class="lead" data-t="card.import.lead"></p><p class="small extra-row"><span data-t="card.import.extra"></span><button class="btn disclose" data-look="link" data-act="toggleMore" aria-expanded="false"><span data-t="btn.more"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></p><div class="more" hidden><p class="small ink" data-t="card.import.found"></p><p class="small" data-t="card.import.scope"></p><p class="small ink model-row"><span data-t="card.import.model"></span><button class="btn" data-look="link" data-act="toggleModels" aria-expanded="false" data-t="btn.changeModel"></button></p><ul class="models" hidden></ul><div class="opts"><label><input type="checkbox" data-opt="regen"><span data-t="card.import.optRegen"></span></label><label><input type="checkbox" data-opt="skipWork"><span data-t="card.import.optSkipWork"></span></label></div></div></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="copy" data-t="btn.copy"></button><button class="btn" data-look="soft" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button><p class="foot" data-t="note.copyLater"></p></div></section>
<section class="card" data-kind="importSpace" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.importSpace"></h2><p class="lead" data-t="card.importSpace.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="pick" data-t="btn.pickPlace"></button><button class="btn" data-look="soft" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button></div></section>
<section class="card" data-kind="copying" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.copying"></h2><div class="copy-steps"><ol class="steps"><li data-step="1"><span class="mark" aria-hidden="true"><span class="dot"></span><svg class="check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8"/><path d="M4.6 8.3 7 10.6l4.4-4.9"/></svg></span><span data-t="card.copying.step1"></span></li><li data-step="2"><span class="mark" aria-hidden="true"><span class="dot"></span><svg class="check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8"/><path d="M4.6 8.3 7 10.6l4.4-4.9"/></svg></span><span data-t="card.copying.step2"></span></li><li data-step="3"><span class="mark" aria-hidden="true"><span class="dot"></span><svg class="check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8"/><path d="M4.6 8.3 7 10.6l4.4-4.9"/></svg></span><span data-t="card.copying.step3"></span></li></ol><div class="bar" aria-hidden="true"><span class="bar-fill"></span></div></div><div class="confirm" hidden><p class="lead" data-t="card.copying.stopConfirm"></p></div></div><div class="card-actions"><span class="eta small"></span><button class="btn stop" data-look="soft" data-act="stopCopy" data-t="btn.stopCopy"></button><button class="btn" data-look="primary" data-act="keepCopying" data-confirm data-t="btn.keepCopying"></button><button class="btn danger" data-look="soft" data-act="stopCopy" data-detail="confirm" data-confirm data-t="btn.stopCopy"></button></div></section>
<section class="card" data-kind="inUse" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.inUse"></h2><p class="lead" data-t="card.inUse.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button></div></section>
<section class="card" data-kind="newerUpdating" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.newer"></h2><p class="lead" data-t="card.newerUpdating.lead"></p><p class="small"><span data-t="card.update.slow"></span> <button class="btn" data-look="link" data-act="manualDownload" data-t="btn.manualDownload"></button></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button></div></section>
<section class="card" data-kind="newer" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.newer"></h2><p class="lead" data-t="card.newer.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="startWithout" data-t="btn.startWithout"></button><p class="foot" data-t="note.copyAgain"></p></div></section>
<section class="card" data-kind="importFailed" hidden><div class="card-scroll"><p class="lead" data-t="card.importFailed.lead"></p><div class="card-actions"><button class="btn" data-look="primary" data-act="retry" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="answer" data-detail="startWithout" data-t="btn.startWithout"></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button><button class="btn disclose" data-look="link" data-act="toggleDetails" aria-expanded="false"><span data-t="btn.details"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div><div class="log" hidden><pre></pre></div></div></section>
<section class="card" data-kind="vpn" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.vpn"></h2><p class="lead" data-t="card.vpn.{problem}"></p><p class="small" data-t="card.vpn.auto"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="reconnect" data-t="btn.retry"></button></div></section>
<section class="card" data-kind="link" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.link"></h2><p class="lead" data-t="card.link.lead"></p><p class="small" data-signin data-t="card.link.browser" hidden></p><div class="link-row"><input class="link-input" type="url" autocomplete="off" spellcheck="false"><button class="btn" data-look="primary" data-act="link" data-t="btn.openLink"></button></div><p class="small danger" data-problem data-t="card.link.{problem}" hidden></p></div><div class="card-actions" data-signin hidden><button class="btn" data-look="link" data-act="signIn" data-t="btn.signIn"></button></div></section>
<section class="card" data-kind="watchdog" hidden><div class="card-actions"><button class="btn" data-look="primary" data-act="wait" data-t="btn.wait"></button><button class="btn" data-look="soft" data-act="retry" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="openLogs" data-t="btn.openLogs"></button></div></section>
<section class="card" data-kind="failed" hidden><div class="card-scroll"><p class="lead" data-t="reason.start.{reason}"></p><div class="banner" hidden><div class="banner-row"><p class="lead" data-t="card.update.available"></p><button class="btn" data-look="primary" data-act="installUpdate" data-u="available" data-t="btn.install"></button></div><div class="banner-down" data-u="downloading"><p class="small banner-line"><span data-t="card.update.downloading"></span><span class="slow"><span data-t="card.update.slow"></span><button class="btn" data-look="link" data-act="manualDownload" data-t="btn.manualDownload"></button></span></p><div class="bar"><span class="bar-fill"></span></div></div><p class="small" data-u="installing" data-t="card.update.installing"></p><div class="banner-fail" data-u="failed"><p class="small danger" data-t="card.update.failed"></p><button class="btn" data-look="small" data-act="installUpdate" data-t="btn.retry"></button><button class="btn" data-look="small" data-act="manualDownload" data-t="btn.manualDownload"></button></div></div><div class="card-actions"><button class="btn" data-look="primary" data-act="retry" data-main data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="pick" data-detail="changePlace" data-places data-t="btn.changePlace" hidden></button><button class="btn" data-look="soft" data-act="freshStart" data-places data-t="btn.freshStart" hidden></button><button class="btn" data-look="soft" data-act="openLogs" data-t="btn.openLogs"></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button><button class="btn disclose" data-look="link" data-act="toggleDetails" aria-expanded="false"><span data-t="btn.details"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div><div class="log" hidden><pre></pre></div></div></section>
<section class="card" data-kind="viewFailed" hidden><div class="card-actions"><button class="btn" data-look="primary" data-act="reloadView" data-t="btn.reload"></button><button class="btn" data-look="soft" data-act="openLogs" data-t="btn.openLogs"></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button></div></section>
</div>
</section>
</main>
<footer class="footrow"><span class="note" data-t="foot.community"></span><p class="place" hidden><span class="place-text"></span><span aria-hidden="true">·</span><button class="btn" data-look="link" data-act="pick" data-detail="changePlace" data-t="btn.changePlace"></button></p></footer>
<p class="sr live" aria-live="polite"></p>
</body>
</html>
